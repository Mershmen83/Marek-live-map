name: One-shot post-Break map semantic repair

on:
  push:
    branches:
      - post-break-map-semantic-repair

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: post-break-map-semantic-repair
          fetch-depth: 0

      - name: Apply semantic repair
        run: python .github/repair_post_break_map.py

      - name: Commit repaired map
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/map-state.json
          if git diff --cached --quiet; then
            echo "Map already reconciled."
            exit 0
          fi
          git commit -m "Reconcile post-Break live-map truth layers"
          git push origin HEAD:post-break-map-semantic-repair
