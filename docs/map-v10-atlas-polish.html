<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mårék Live Map — V10 Atlas Polish</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121719}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="v9" src="map-v9-atlas-detail.html" title="Mårék V10 atlas polish beta"></iframe><script>
const outer=document.getElementById('v9'),NS='http://www.w3.org/2000/svg';
const E=(d,n,a={})=>{const x=d.createElementNS(NS,n);for(const[k,v]of Object.entries(a))x.setAttribute(k,v);return x};
const P=p=>({x:610+p.x*245,y:440-p.y*190});
function innerDoc(){const d=outer.contentDocument,inner=d&&d.getElementById('atlas');return inner&&inner.contentDocument}
function findFeature(state,id){return state.features.find(x=>x.id===id)}
function show(d,f){const t=d.getElementById('detailTitle'),b=d.getElementById('detailBody');if(t)t.textContent=f.name;if(b)b.innerHTML=f.known_facts?.length?`<ul>${f.known_facts.map(x=>`<li>${x}</li>`).join('')}</ul>`:'<p>No additional player-known details.</p>'}
function boulder(d,g,p){const a=E(d,'path',{d:`M ${p.x-10} ${p.y+5} Q ${p.x-12} ${p.y-4} ${p.x-5} ${p.y-9} Q ${p.x+1} ${p.y-6} ${p.x+1} ${p.y+5} Z`,fill:'#9a8059',stroke:'#3b2b1c','stroke-width':'1'}),b=E(d,'path',{d:`M ${p.x+1} ${p.y+5} Q ${p.x+1} ${p.y-6} ${p.x+7} ${p.y-8} Q ${p.x+13} ${p.y-2} ${p.x+10} ${p.y+6} Z`,fill:'#9a8059',stroke:'#3b2b1c','stroke-width':'1'});g.append(a,b,E(d,'path',{d:`M ${p.x} ${p.y-5} L ${p.x-2} ${p.y} L ${p.x+1} ${p.y+5}`,fill:'none',stroke:'#3b2b1c','stroke-width':'1'}))}
function ruins(d,g,p){g.append(E(d,'path',{d:`M ${p.x-12} ${p.y+8} L ${p.x-12} ${p.y-5} L ${p.x-6} ${p.y-5} L ${p.x-6} ${p.y+2} L ${p.x+1} ${p.y+2} L ${p.x+1} ${p.y-8} L ${p.x+8} ${p.y-8} L ${p.x+8} ${p.y+8}`,fill:'none',stroke:'#59422b','stroke-width':'1.4'}),E(d,'line',{x1:p.x-15,y1:p.y+8,x2:p.x+12,y2:p.y+8,stroke:'#59422b','stroke-width':'1'}))}
function junction(d,g,p){g.append(E(d,'path',{d:`M ${p.x} ${p.y+8} L ${p.x} ${p.y-1} M ${p.x} ${p.y-1} L ${p.x-7} ${p.y-8} M ${p.x} ${p.y-1} L ${p.x+7} ${p.y-8}`,fill:'none',stroke:'#4c3824','stroke-width':'2','stroke-linecap':'round'}),E(d,'circle',{cx:p.x,cy:p.y+9,r:2.2,fill:'#7d6747',stroke:'#3d2d1d','stroke-width':'.8'}))}
function compassPolish(d,g){const c=E(d,'g',{transform:'translate(116 128)'});c.append(E(d,'circle',{cx:0,cy:0,r:23,fill:'none',stroke:'#4a3622','stroke-width':'1'}),E(d,'circle',{cx:0,cy:0,r:15,fill:'none',stroke:'#6c5335','stroke-width':'.7'}),E(d,'path',{d:'M 0 -27 L 5 -5 L 0 0 L -5 -5 Z M 27 0 L 5 5 L 0 0 L 5 -5 Z M 0 27 L -5 5 L 0 0 L 5 5 Z M -27 0 L -5 -5 L 0 0 L -5 5 Z',fill:'#5a422a',opacity:'.8'}));for(const [x,y,t] of [[0,-34,'N'],[34,4,'E'],[0,42,'S'],[-35,4,'W']]){const z=E(d,'text',{x,y,'text-anchor':'middle','font-family':'Georgia,serif','font-size':'10','font-weight':'700',fill:'#3b2b1c'});z.textContent=t;c.append(z)}g.append(c)}
function titleCartouche(d,g){const x=898,y=648,w=214,h=72,c=E(d,'g');c.append(E(d,'rect',{x,y,width:w,height:h,rx:3,fill:'rgba(234,216,178,.82)',stroke:'#5a432b','stroke-width':'1.1'}),E(d,'line',{x1:x+9,y1:y+10,x2:x+w-9,y2:y+10,stroke:'#8a6f49','stroke-width':'.8'}));const t=E(d,'text',{x:x+w/2,y:y+31,'text-anchor':'middle','font-family':'Georgia,serif','font-size':'15','font-weight':'700','letter-spacing':'2',fill:'#3b2b1c'});t.textContent="MÅRÉK'S KNOWN REGION";const s=E(d,'text',{x:x+w/2,y:y+51,'text-anchor':'middle','font-family':'Georgia,serif','font-size':'9','letter-spacing':'1',fill:'#70593b'});s.textContent='PLAYER-KNOWN ATLAS · SCHEMATIC DISTANCES';c.append(t,s);g.append(c)}
function paperStains(d,g){for(const [x,y,r,o] of [[82,82,58,.08],[1110,92,74,.06],[1070,714,92,.05],[120,704,68,.055]])g.append(E(d,'circle',{cx:x,cy:y,r,fill:'#8f5f37',opacity:o}))}
function applyLabels(d,map){const alwaysHide=new Set(['Stone-bottomed Stream Crossing','West Road Stone Bridge','West Road Creek Ford','Dāren Road Marker','Broad Shallow Ford','Split Boulder']);const minorKeep=new Set(['Saddle Ridge','Low Ridge','Kareth Quarry','Rell Quarry','Old Avelin Site']);function refresh(){const vb=map.viewBox.baseVal,scale=1200/(vb.width||1200);[...d.querySelectorAll('#labels text')].forEach(t=>{const name=(t.textContent||'').trim();if(alwaysHide.has(name)){t.style.display='none';return}if(name==='Old Avelin Site')t.textContent='Old Avelin';if(t.classList.contains('minorLabel'))t.style.display=(scale>=1.42||minorKeep.has(name))?'':'none'})}refresh();new MutationObserver(refresh).observe(map,{attributes:true,attributeFilter:['viewBox']})}
async function enhance(){const d=innerDoc();if(!d||!d.getElementById('map')||d.getElementById('v10-polish'))return false;const state=await fetch('map-state.json').then(r=>r.json());const map=d.getElementById('map'),orn=d.getElementById('ornaments'),markers=d.getElementById('markers');if(!orn||!markers)return false;const title=d.querySelector('h1'),sub=d.querySelector('.sub');if(title)title.textContent='Mårék Live Map — V10 Atlas Polish Beta';if(sub)sub.textContent='Third atlas pass · cleaner label hierarchy · landmark symbols · stronger map furniture';const og=E(d,'g',{id:'v10-polish','pointer-events':'none'}),mg=E(d,'g',{id:'v10-landmarks'});orn.append(og);markers.append(mg);paperStains(d,og);compassPolish(d,og);titleCartouche(d,og);
for(const [id,draw] of [['split-boulder',boulder],['old-avelin-site',ruins]]){const f=findFeature(state,id);if(!f)continue;const p=P(f.position),g=E(d,'g',{class:'mapSymbol',style:'cursor:pointer'});draw(d,g,p);const h=E(d,'circle',{cx:p.x,cy:p.y,r:14,fill:'transparent'});h.onclick=()=>show(d,f);g.append(h);mg.append(g)}
for(const id of ['meren-junction','day3-current-junction']){const f=findFeature(state,id);if(!f)continue;const p=P(f.position),g=E(d,'g',{class:'mapSymbol',style:'cursor:pointer'});junction(d,g,p);const h=E(d,'circle',{cx:p.x,cy:p.y,r:13,fill:'transparent'});h.onclick=()=>show(d,f);g.append(h);mg.append(g)}
applyLabels(d,map);const detail=d.getElementById('detailBody');if(detail)detail.innerHTML='<p><strong>Third atlas pass applied.</strong> Minor labels now declutter as you zoom out, the split boulder and road junctions use illustrated symbols, Old Avelin reads as a ruin, and the map gets a proper title cartouche and richer compass treatment.</p><p class="muted">Still player-safe: no new forests, mountains, rivers, borders, or place names were invented.</p>';return true}
let tries=0;const timer=setInterval(async()=>{tries++;try{if(await enhance())clearInterval(timer)}catch(e){}if(tries>30)clearInterval(timer)},300);outer.addEventListener('load',()=>{tries=0});
</script></body></html>
