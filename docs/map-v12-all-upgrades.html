<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mårék Live Map — V12 All Upgrades</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121719}iframe{border:0;width:100%;height:100%;display:block}</style></head><body><iframe id="v10" src="map-v10-atlas-polish.html" title="Mårék V12 all-upgrades beta"></iframe><script>
const outer=document.getElementById('v10'),NS='http://www.w3.org/2000/svg';
const E=(d,n,a={})=>{const x=d.createElementNS(NS,n);for(const[k,v]of Object.entries(a))x.setAttribute(k,v);return x};
const P=p=>({x:610+p.x*245,y:440-p.y*190});
function deepestDoc(doc){let d=doc,safety=0;while(d&&safety<6){if(d.getElementById&&d.getElementById('map'))return d;const f=d.querySelector&&d.querySelector('iframe');if(!f||!f.contentDocument)break;d=f.contentDocument;safety++;}return d}
function tree(d,g,x,y,s=1){g.append(E(d,'line',{x1:x,y1:y+3*s,x2:x,y2:y+9*s,stroke:'#5d4932','stroke-width':'.75'}));g.append(E(d,'path',{d:`M ${x} ${y-7*s} C ${x-6*s} ${y-3*s},${x-5*s} ${y+1*s},${x-2*s} ${y+3*s} C ${x-7*s} ${y+4*s},${x-6*s} ${y+8*s},${x} ${y+7*s} C ${x+6*s} ${y+8*s},${x+7*s} ${y+4*s},${x+2*s} ${y+3*s} C ${x+5*s} ${y+1*s},${x+6*s} ${y-3*s},${x} ${y-7*s} Z`,fill:'none',stroke:'#5d4932','stroke-width':'1'}))}
function field(d,g,x,y,w=18,h=8,r=0,o=.12){const q=E(d,'g',{transform:`translate(${x} ${y}) rotate(${r})`});q.append(E(d,'rect',{x:-w/2,y:-h/2,width:w,height:h,rx:'1.2',fill:`rgba(134,128,80,${o})`,stroke:'#7c6c49','stroke-width':'.8'}));for(let yy=-h/2+2;yy<h/2;yy+=3.2){q.append(E(d,'line',{x1:-w/2+1.5,y1:yy,x2:w/2-1.5,y2:yy,stroke:'#8a7a53','stroke-width':'.55',opacity:'.55'}))}g.append(q)}
function hut(d,g,x,y,w=6,h=4){g.append(E(d,'rect',{x:x-w/2,y:y-h/2,width:w,height:h,rx:'.7',fill:'#745c42',stroke:'#382819','stroke-width':'.75'}));g.append(E(d,'path',{d:`M ${x-w/2} ${y-h/2+.5} L ${x} ${y-h/2-2.4} L ${x+w/2} ${y-h/2+.5}`,fill:'none',stroke:'#382819','stroke-width':'.7'}))}
function rock(d,g,x,y,s=1){g.append(E(d,'path',{d:`M ${x-5*s} ${y+2*s} L ${x-2*s} ${y-4*s} L ${x+4*s} ${y-3*s} L ${x+6*s} ${y+2*s} L ${x+1*s} ${y+5*s} Z`,fill:'none',stroke:'#594733','stroke-width':'1'}))}
function hatch(d,g,x,y,w=70,h=24,n=4,o=1){for(let i=0;i<n;i++)g.append(E(d,'path',{d:`M ${x-w/2+i*4} ${y+i*7} Q ${x} ${y-h+i*4} ${x+w/2+i*5} ${y+i*5}`,fill:'none',stroke:i?'#816b4b':'#6d583c','stroke-width':i?'.85':'1.4',opacity:(i?'.7':'1')*o}))}
function waystone(d,g,x,y,r=2.5){g.append(E(d,'circle',{cx:x,cy:y,r,fill:'#725b3e',stroke:'#332518','stroke-width':'.8'}));g.append(E(d,'line',{x1:x-r-3,y1:y,x2:x+r+3,y2:y,stroke:'#d3bd92','stroke-width':'.75'}))}
function wash(d,g,pts,fill,op=.18){g.append(E(d,'path',{d:`M ${pts.map(p=>p.join(' ')).join(' L ')} Z`,fill,opacity:String(op)}))}
function banner(d,g,text){const x=600,y=96,w=286;g.append(E(d,'path',{d:`M ${x-w/2} ${y} q 18 -18 36 0 h ${w-72} q 18 -18 36 0 q -18 18 0 36 q -18 -18 -36 0 h -${w-72} q -18 18 -36 0 q 18 -18 0 -36 Z`,fill:'rgba(234,216,178,.82)',stroke:'#4b3621','stroke-width':'1.3'}));const t=E(d,'text',{x,y:102,'text-anchor':'middle','font-family':'Georgia, Times New Roman, serif','font-size':'20','font-weight':'700',fill:'#382819'});t.textContent=text;g.append(t)}
function enhance(){const d=deepestDoc(outer.contentDocument);if(!d||!d.getElementById||!d.getElementById('map')||d.getElementById('v12-all'))return;const title=d.querySelector('h1'),sub=d.querySelector('.sub');if(title)title.textContent='Mårék Live Map — V12 All-Upgrades Beta';if(sub)sub.textContent='Exploration contrast · deeper local detail · atlas presentation polished into a lived-in campaign record';
const terrain=d.getElementById('terrain'),sett=d.getElementById('settlements'),orn=d.getElementById('ornaments')||d.getElementById('labels');if(!terrain||!sett||!orn)return;const tg=E(d,'g',{id:'v12-all','pointer-events':'none'}),sg=E(d,'g',{id:'v12-local','pointer-events':'none'}),og=E(d,'g',{id:'v12-orn','pointer-events':'none'});terrain.append(tg);sett.append(sg);orn.append(og);banner(d,og,'The Known Roads of Mårék');
const kareth=P({x:0,y:0}),avelin=P({x:.18,y:.12}),low=P({x:.30,y:.50}),cross=P({x:.23,y:.82}),val=P({x:.16,y:1.15}),daren=P({x:-1.58,y:.67}),quarry=P({x:-.55,y:-.55}),rell=P({x:-1.78,y:.98});
wash(d,tg,[[kareth.x-50,kareth.y+15],[avelin.x+30,avelin.y-10],[cross.x+45,cross.y+16],[val.x+28,val.y+30],[low.x-35,low.y+30]],'#e8d4ab',.16);
wash(d,tg,[[val.x-24,val.y+10],[daren.x-18,daren.y+8],[daren.x+44,daren.y+28],[val.x+34,val.y+38]],'#e5d0a0',.13);
wash(d,tg,[[rell.x-72,rell.y-30],[rell.x+56,rell.y-20],[rell.x+80,rell.y+62],[rell.x-62,rell.y+70]],'#f4ebd8',.18);
const haze=E(d,'g',{opacity:'.46'});for(let i=0;i<8;i++)haze.append(E(d,'path',{d:`M ${rell.x-52+i*13} ${rell.y-6+i*2} q 18 -10 36 0`,fill:'none',stroke:'#8c7d63','stroke-width':'1'}));tg.append(haze);
field(d,tg,kareth.x+34,kareth.y+26,26,10,-12,.14);field(d,tg,kareth.x+53,kareth.y+33,22,9,8,.14);field(d,tg,kareth.x+42,kareth.y+48,24,9,14,.13);field(d,tg,kareth.x-34,kareth.y+32,18,8,12,.1);
field(d,tg,avelin.x+28,avelin.y+6,19,8,-16,.12);field(d,tg,avelin.x+30,avelin.y+20,17,7,10,.11);
hatch(d,tg,(low.x+cross.x)/2-8,(low.y+cross.y)/2+18,82,22,3,.9);hatch(d,tg,(cross.x+val.x)/2+12,(cross.y+val.y)/2+8,70,18,2,.8);hatch(d,tg,(val.x+daren.x)/2+10,(val.y+daren.y)/2+16,88,22,2,.6);
for(let i=0;i<7;i++)rock(d,tg,quarry.x-58+i*16,quarry.y-12+(i%2)*8,.9);rock(d,tg,quarry.x+20,quarry.y+18,1.3);
for(const t of [[cross.x+20,cross.y+28,1],[cross.x+33,cross.y+30,.86],[cross.x+46,cross.y+25,.9],[daren.x-76,daren.y+2,.8],[daren.x-60,daren.y-2,.92],[daren.x+64,daren.y+7,.85]])tree(d,tg,...t);
for(const s of [[(kareth.x+avelin.x)/2+3,(kareth.y+avelin.y)/2-2],[(avelin.x+low.x)/2+8,(avelin.y+low.y)/2+10],[(cross.x+val.x)/2-12,(cross.y+val.y)/2-4],[(val.x+daren.x)/2+8,(val.y+daren.y)/2+8]])waystone(d,tg,...s);
hut(d,sg,kareth.x+22,kareth.y+2,5,3.5);hut(d,sg,kareth.x-28,kareth.y+10,5.5,3.6);hut(d,sg,kareth.x+8,kareth.y-18,5.2,3.2);hut(d,sg,avelin.x+16,avelin.y-5,5,3.3);hut(d,sg,avelin.x+12,avelin.y+14,4.8,3.1);
for(let i=0;i<5;i++)hut(d,sg,val.x-18+i*8,val.y+11+(i%2)*3,4.8,3.2);for(let i=0;i<5;i++)hut(d,sg,daren.x-18+i*9,daren.y+16+(i%2)*2,4.6,3.1);
for(let i=0;i<4;i++)sg.append(E(d,'line',{x1:daren.x-28+i*12,y1:daren.y+8,x2:daren.x-24+i*12,y2:daren.y+18,stroke:'#4b3926','stroke-width':'1.1'}));
const detail=d.getElementById('detailBody');if(detail)detail.innerHTML='<p><strong>All queued upgrades applied.</strong> The atlas now distinguishes explored corridors from reported space, adds deeper local texture around important settlements, and improves the sense that this is a lived-in region rather than a chain of points.</p><ul><li><strong>Observed areas</strong> read warmer, denser, and more confident.</li><li><strong>Reported or uncertain areas</strong> stay lighter and hazier.</li><li><strong>Kareth, Avelin, Valek, and Dāren</strong> gain extra working-land and outskirts detail.</li><li><strong>Route furniture</strong> like waystones helps traveled roads feel established.</li></ul><p class="muted">No new undiscovered forests, rivers, settlements, or borders were invented.</p>';
const summary=d.getElementById('roadSummary');if(summary)summary.innerHTML="<div class='route'><strong>Exploration contrast</strong><div class='muted'>Observed land now reads more confidently, while reported space stays hazier and less detailed.</div></div><div class='route'><strong>Local depth</strong><div class='muted'>Kareth, Avelin, Valek, and Dāren gain more outskirts, structures, and working-land texture.</div></div><div class='route'><strong>Campaign readability</strong><div class='muted'>The atlas should now read as both a world map and a record of what Mårék actually knows.</div></div>";
}
outer.addEventListener('load',()=>{setTimeout(enhance,500);setTimeout(enhance,1500);setTimeout(enhance,2800)});
</script></body></html>
