<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Mårék Live Map — V13 Mobile Cleanup</title><style>html,body{margin:0;width:100%;height:100%;overflow:auto;background:#121719}iframe{border:0;width:100%;height:100vh;display:block}</style></head><body><iframe id="atlas" src="map-v8-atlas-style.html" title="Mårék V13 atlas"></iframe><script>
const frame=document.getElementById('atlas'),NS='http://www.w3.org/2000/svg';
const E=(d,n,a={})=>{const x=d.createElementNS(NS,n);for(const[k,v]of Object.entries(a))x.setAttribute(k,v);return x};
const P=p=>({x:610+p.x*245,y:440-p.y*190});
function field(d,g,x,y,w=18,h=8,r=0){const q=E(d,'g',{transform:`translate(${x} ${y}) rotate(${r})`});q.append(E(d,'rect',{x:-w/2,y:-h/2,width:w,height:h,rx:1.1,fill:'rgba(134,128,80,.11)',stroke:'#7c6c49','stroke-width':'.75'}));for(let yy=-h/2+2;yy<h/2;yy+=3)q.append(E(d,'line',{x1:-w/2+1,y1:yy,x2:w/2-1,y2:yy,stroke:'#8a7a53','stroke-width':'.5',opacity:'.48'}));g.append(q)}
function hut(d,g,x,y,w=5,h=3.4){g.append(E(d,'rect',{x:x-w/2,y:y-h/2,width:w,height:h,rx:.6,fill:'#745c42',stroke:'#382819','stroke-width':'.7'}));g.append(E(d,'path',{d:`M ${x-w/2} ${y-h/2+.4} L ${x} ${y-h/2-2.1} L ${x+w/2} ${y-h/2+.4}`,fill:'none',stroke:'#382819','stroke-width':'.65'}))}
function wash(d,g,pts,fill,op){g.append(E(d,'path',{d:`M ${pts.map(p=>p.join(' ')).join(' L ')} Z`,fill,opacity:op}))}
function apply(){const d=frame.contentDocument,w=frame.contentWindow;if(!d||!d.getElementById('map')||d.getElementById('v13-clean'))return;const map=d.getElementById('map'),terrain=d.getElementById('terrain'),sett=d.getElementById('settlements'),labels=d.getElementById('labels');if(!terrain||!sett||!labels)return;
const title=d.querySelector('h1'),sub=d.querySelector('.sub');if(title)title.textContent='Mårék Live Map — V13 Clean Atlas Beta';if(sub)sub.textContent='Flattened atlas · mobile-first spacing · zoom-aware labels · explored-vs-reported contrast';
// Mobile sizing: remove the huge top/bottom letterbox caused by a tall fixed SVG viewport.
const style=d.createElement('style');style.id='v13-style';style.textContent=`@media(max-width:900px){main{grid-template-columns:1fr!important}.mapwrap{min-height:0!important}#map{height:auto!important;aspect-ratio:1200/820!important}.ctl{top:7px!important;right:7px!important}.side{padding:12px!important}} #labels text{transition:opacity .12s ease}`;d.head.append(style);map.setAttribute('preserveAspectRatio','xMidYMid meet');
// Remove the broad region title at top; the existing lower-right atlas cartouche already names the region.
d.querySelectorAll('.regionLabel').forEach(x=>x.style.display='none');
const tg=E(d,'g',{id:'v13-clean','pointer-events':'none'}),sg=E(d,'g',{id:'v13-local','pointer-events':'none'});terrain.append(tg);sett.append(sg);
const k=P({x:0,y:0}),a=P({x:.18,y:.12}),low=P({x:.30,y:.50}),cross=P({x:.23,y:.82}),val=P({x:.16,y:1.15}),dar=P({x:-1.58,y:.67}),rell=P({x:-1.78,y:.98});
// Light confidence washes: explored corridors feel established; reported Rell country stays pale.
wash(d,tg,[[k.x-48,k.y+18],[a.x+34,a.y-8],[cross.x+42,cross.y+18],[val.x+28,val.y+34],[low.x-30,low.y+34]],'#e3c999','.12');
wash(d,tg,[[val.x-20,val.y+10],[dar.x-26,dar.y+8],[dar.x+46,dar.y+30],[val.x+30,val.y+36]],'#ddc28e','.09');
wash(d,tg,[[rell.x-62,rell.y-28],[rell.x+58,rell.y-20],[rell.x+72,rell.y+58],[rell.x-58,rell.y+65]],'#f4ebd8','.20');
field(d,tg,k.x+34,k.y+27,25,9,-12);field(d,tg,k.x+53,k.y+34,21,8,8);field(d,tg,a.x+28,a.y+7,18,7,-14);field(d,tg,a.x+29,a.y+19,16,6,9);
hut(d,sg,k.x+22,k.y+3);hut(d,sg,k.x-27,k.y+10);hut(d,sg,a.x+15,a.y-5);for(let i=0;i<4;i++)hut(d,sg,val.x-14+i*8,val.y+12+(i%2)*3);for(let i=0;i<4;i++)hut(d,sg,dar.x-15+i*9,dar.y+16+(i%2)*2);
// Explicit label positions for the crowded core.
const fixes={
'kareth':{x:k.x-24,y:k.y+30,a:'end'},
'avelin':{x:a.x+23,y:a.y-14,a:'start'},
'valek':{x:val.x+16,y:val.y-14,a:'start'},
'dāren ford':{x:dar.x+18,y:dar.y-15,a:'start'},
'daren ford':{x:dar.x+18,y:dar.y-15,a:'start'},
'rell quarry':{x:rell.x-18,y:rell.y-16,a:'end'},
'kareth quarry':{x:P({x:-.55,y:-.55}).x-12,y:P({x:-.55,y:-.55}).y+25,a:'end'},
'low ridge':{x:low.x+18,y:low.y+18,a:'start'},
'saddle ridge':{x:P({x:.70,y:.60}).x+18,y:P({x:.70,y:.60}).y-10,a:'start'},
'old avelin site':{x:P({x:.94,y:.78}).x+15,y:P({x:.94,y:.78}).y-12,a:'start'}
};
function normalize(s){return (s||'').trim().toLowerCase().replace(/å/g,'a').replace(/ā/g,'a')}
const keepAtOverview=new Set(['kareth','avelin','valek','daren ford','dāren ford','rell quarry','kareth quarry']);
function layoutLabels(){const vb=map.viewBox.baseVal,zoom=1200/(vb&&vb.width?vb.width:1200);labels.querySelectorAll('text').forEach(t=>{const raw=(t.textContent||'').trim(),key=normalize(raw),f=fixes[key];if(f){t.setAttribute('x',f.x);t.setAttribute('y',f.y);t.setAttribute('text-anchor',f.a)}const minor=t.classList.contains('minorLabel')||['low ridge','saddle ridge','old avelin site','split boulder'].includes(key);if(minor&&!keepAtOverview.has(raw.toLowerCase())){t.style.opacity=zoom<1.28?'0':'1';t.style.pointerEvents=zoom<1.28?'none':''}else t.style.opacity='1'})}
layoutLabels();new MutationObserver(layoutLabels).observe(map,{attributes:true,attributeFilter:['viewBox']});
const detail=d.getElementById('detailBody');if(detail)detail.innerHTML='<p><strong>Mobile collision cleanup applied.</strong> I flattened the beta back to the V8 base instead of stacking V9/V10/V12 inside each other, removed the duplicate region heading, repositioned the crowded settlement labels, and made smaller landmark labels appear as you zoom in.</p><p class="muted">I also fixed the tall mobile letterboxing visible in your screenshot, so the parchment should use the available width instead of sitting between large dark bands.</p>';
}
frame.addEventListener('load',()=>{setTimeout(apply,300);setTimeout(apply,900)});
</script></body></html>
