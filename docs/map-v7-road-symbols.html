<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mårék Live Map V7</title><style>:root{--ui:#1c2326;--ui2:#273034;--text:#ddd8cf;--muted:#a1a7a2;--paper1:#eadcbc;--paper2:#d9c39a;--paper3:#b58f60;--road:#816a48;--roadEdge:#3f2f1f;--water:#69879c;--wall:#f1e8da}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text);background:radial-gradient(circle at 50% 10%,#4a5458,#20282b 42%,#13191b)}header{padding:11px 14px 7px;text-align:center}h1{margin:0;font-size:clamp(1.3rem,4vw,1.95rem)}.sub,.muted{color:var(--muted);font-size:.85rem}main{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:12px;padding:10px;max-width:1540px;margin:auto}.card{background:linear-gradient(180deg,var(--ui2),var(--ui));border:1px solid rgba(255,255,255,.08);border-radius:12px;box-shadow:0 12px 28px rgba(0,0,0,.35)}.mapwrap{position:relative;overflow:hidden;min-height:75vh}#map{display:block;width:100%;height:75vh;touch-action:none}.ctl{position:absolute;top:8px;right:8px;display:flex;gap:6px;z-index:5}.ctl button,.ctl span{border:1px solid rgba(255,255,255,.12);background:rgba(15,19,21,.92);color:var(--text);border-radius:8px;padding:6px 8px;font:700 12px system-ui}.side{padding:13px}.side h2,.side h3{margin:0 0 8px}.route{padding:7px 8px;margin:6px 0;border-left:3px solid #b5a079;background:rgba(255,255,255,.04);border-radius:0 7px 7px 0}.section{padding:8px 0;border-top:1px solid rgba(255,255,255,.07)}.section:first-child{border-top:0}.chip{display:inline-block;margin:2px 4px 2px 0;padding:3px 7px;border-radius:999px;border:1px solid rgba(255,255,255,.1);font-size:.75rem;color:#c8c7c0;background:rgba(255,255,255,.035)}.roadE{fill:none;stroke:var(--roadEdge);stroke-width:8;stroke-linecap:round}.road{fill:none;stroke:var(--road);stroke-width:4;stroke-linecap:round}.track{fill:none;stroke:#8e7959;stroke-width:3;stroke-dasharray:7 7;stroke-linecap:round}.hit{fill:none;stroke:transparent;stroke-width:20;pointer-events:stroke;cursor:pointer}.wall{fill:rgba(57,45,31,.17);stroke:var(--wall);stroke-width:2.2}.oldwall{fill:none;stroke:#7d756a;stroke-width:1.5;stroke-dasharray:4 3}.building{fill:#807669;stroke:#403226;stroke-width:.9}.field{fill:rgba(137,149,107,.2);stroke:rgba(117,128,90,.58);stroke-width:1}.water{fill:none;stroke:var(--water);stroke-width:3.1;stroke-linecap:round}.ridge{fill:none;stroke:rgba(108,91,65,.82);stroke-width:3.7}.marker{cursor:pointer}.marker text{font:800 18px system-ui;fill:#f7f2e8;text-anchor:middle;dominant-baseline:middle}.label{font-size:12px;font-weight:750;fill:#eee6d6;paint-order:stroke;stroke:#111;stroke-width:3px}.major{font-size:16px;font-weight:850}.current{fill:none;stroke:#fff8e8;stroke-width:2;stroke-dasharray:4 4}.inline-symbol{cursor:pointer}.bridge-bed{fill:#c2a477;stroke:#4a3825;stroke-width:1}.bridge-rail{stroke:#4d3823;stroke-width:2.1;stroke-linecap:round}.bridge-cap{stroke:#2f241a;stroke-width:2.6;stroke-linecap:round}.ford-water{fill:none;stroke:#66889d;stroke-width:2.1;stroke-linecap:round}.ford-stone{fill:#c5ad80;stroke:#5b4930;stroke-width:.8}.roadstone{fill:#7d6748;stroke:#3f2f1f;stroke-width:1}.legend-symbol{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:18px;margin-right:5px;border-radius:4px;background:rgba(255,255,255,.04);font-weight:800;color:#d8cdb9}@media(max-width:900px){main{grid-template-columns:1fr}#map{height:64vh}}</style></head><body><header><h1>Mårék Live Map — V7 Beta</h1><div class="sub">Parchment map · grey site UI · road-integrated bridge, ford and marker symbols</div></header><main><section class="card mapwrap"><div class="ctl"><span id="zoomRead">1.0×</span><button id="zoomIn">＋</button><button id="zoomOut">−</button><button id="reset">Reset</button></div><svg id="map" viewBox="0 0 1200 820"><defs><radialGradient id="paper" cx="50%" cy="44%" r="67%"><stop offset="0%" stop-color="#eadcbc"/><stop offset="60%" stop-color="#d9c39a"/><stop offset="100%" stop-color="#b58f60"/></radialGradient></defs><rect width="1200" height="820" fill="#ad8658"/><rect x="32" y="27" width="1136" height="766" rx="26" fill="url(#paper)" stroke="#8d6d45" stroke-width="3"/><g id="terrain"></g><g id="settlements"></g><g id="roads"></g><g id="roadSymbols"></g><g id="markers"></g><g id="labels"></g></svg></section><aside><section class="card side"><h2 id="detailTitle">Settlement cards</h2><div id="detailBody"><p>Bridges, fords, and literal road markers are now drawn into the road itself instead of being written out on the map.</p><p><span class="legend-symbol">═╬═</span>bridge &nbsp; <span class="legend-symbol">≈●≈</span>ford &nbsp; <span class="legend-symbol">◆</span>road marker</p></div></section><section class="card side"><h3>Road log</h3><div id="roadSummary"></div></section></aside></main><script>
const NS='http://www.w3.org/2000/svg',svg=document.getElementById('map'),terrain=document.getElementById('terrain'),settlements=document.getElementById('settlements'),roads=document.getElementById('roads'),roadSymbols=document.getElementById('roadSymbols'),markers=document.getElementById('markers'),labels=document.getElementById('labels'),BASE={x:0,y:0,w:1200,h:820};
let view={...BASE},drag=null;
const E=(n,a={})=>{const x=document.createElementNS(NS,n);for(const[k,v]of Object.entries(a))x.setAttribute(k,v);return x},P=p=>({x:600+p.x*240,y:425-p.y*185}),F=(s,id)=>s.features.find(x=>x.id===id);
const eventTypes=new Set(['route_site','road_stop','farmstead','river_site','warehouse','freight_site','route_control']);
const roadNotes={'valek-west-road-observed':['Abandoned wagon found beyond the stone bridge.','Teren recovered after an ambush; a deliberate firing position was identified.','Hidden wagon hollow discovered.','Broken-roof stash shed located.','Farmstead contact made before continuing toward Dāren Ford.'],'kareth-valek-road':['Known order: Low Ridge → Stone-bottomed Stream Crossing → Valek.'],'kareth-saddle-main-road':['Front road from Kareth toward Avelin and Saddle Ridge.'],'kareth-quarry-route':['Quarry-side road climbs southwest into broken stony upland.']};
const cards={kareth:{population:'Not established on the player map.',trade:['Active quarry supports stone supply.','Heavy-haul wagons and draft beasts are available to Kareth.'],defenses:['Old defensive wall remains standing.','New front defensive line is under construction outside the old wall.','Two route gates: front/main and quarry-side.'],projects:['New front defensive line.','Ongoing quarry extraction and heavy-haul logistics.'],notes:['Kareth is the current base settlement on an open shelf / natural terrace.']},avelin:{population:'Not established on the player map.',trade:['Local fields/livestock are part of the settlement economy where established in play.'],defenses:['Separate fortified settlement; not enclosed by Kareth’s wall.'],projects:['Alliance coordination and shared road defense with Kareth.'],notes:['Avelin remains independently led and separately walled.']},valek:{population:'Not established.',trade:['Active market.','Stable yard.','Tavern and road-town services.'],defenses:['No specific defensive layout is established on this player map.'],projects:['No player-known settlement project currently listed.'],notes:['Substantial road town on the Kareth–Valek route.']},'daren-ford':{population:'Not established.',trade:['River freight and storage activity.','Multiple ferry operations along the south bank.','Farms blend into the town economy.'],defenses:['No continuous defensive wall was observed from the approach.'],projects:['No player-known municipal project currently listed.'],notes:['Organic irregular lanes and patched, serviceable buildings.','Current player position is in Dāren Ford.']}};
function showSettlement(x){const c=cards[x.id];if(!c)return showFeature(x);detailTitle.textContent=x.name;const sec=(h,v)=>`<div class='section'><strong>${h}</strong>${Array.isArray(v)?`<ul>${v.map(q=>`<li>${q}</li>`).join('')}</ul>`:`<p>${v}</p>`}</div>`;detailBody.innerHTML=sec('Population',c.population)+sec('Trade',c.trade)+sec('Defenses',c.defenses)+sec('Projects',c.projects)+sec('Notes',c.notes)}
function showFeature(x){detailTitle.textContent=x.name;detailBody.innerHTML=x.known_facts?.length?`<ul>${x.known_facts.map(q=>`<li>${q}</li>`).join('')}</ul>`:'<p>No additional player-known details.</p>'}
function showRoad(x){detailTitle.textContent=x.name;const n=roadNotes[x.id]||x.notes||['No road notes yet.'];detailBody.innerHTML=`<p><strong>Road notes</strong></p><ul>${n.map(q=>`<li>${q}</li>`).join('')}</ul><p class='muted'>Event details are logged here instead of shown as separate map pins.</p>`}
function curve(ps,sgn=1){let d=`M ${ps[0].x} ${ps[0].y}`;for(let i=1;i<ps.length;i++){const a=ps[i-1],b=ps[i],dx=b.x-a.x,dy=b.y-a.y,L=Math.hypot(dx,dy)||1,nx=-dy/L,ny=dx/L,bend=Math.min(34,L*.16)*(i%2?sgn:-sgn);d+=` C ${a.x+dx*.32+nx*bend} ${a.y+dy*.32+ny*bend}, ${a.x+dx*.68-nx*bend*.5} ${a.y+dy*.68-ny*bend*.5}, ${b.x} ${b.y}`}return d}
function anchor(x,r,n){const p=P(x.position);if(x.id==='kareth'&&r.id==='kareth-saddle-main-road')return{x:p.x+12,y:p.y-10};if(x.id==='kareth'&&r.id==='kareth-quarry-route')return{x:p.x-13,y:p.y+11};if(x.type==='fortified_settlement'&&n?.position){const q=P(n.position),dx=q.x-p.x,dy=q.y-p.y,L=Math.hypot(dx,dy)||1;return{x:p.x+dx/L*10,y:p.y+dy/L*8}}return p}
function inlineKind(x){if(x.id==='daren-road-marker')return'marker';if(x.type!=='crossing')return null;const n=x.name.toLowerCase(),facts=(x.known_facts||[]).join(' ').toLowerCase();return n.includes('bridge')||facts.includes('bridge')?'bridge':'ford'}
function symbolAngle(prev,next){return Math.atan2(next.y-prev.y,next.x-prev.x)*180/Math.PI}
function drawInlineSymbol(x,prev,next){const kind=inlineKind(x);if(!kind||!x.position)return;const p=P(x.position),ang=symbolAngle(prev,next),g=E('g',{class:'inline-symbol',transform:`translate(${p.x} ${p.y}) rotate(${ang})`});if(kind==='bridge'){g.append(E('rect',{x:-9,y:-5,width:18,height:10,rx:1.5,class:'bridge-bed'}),E('line',{x1:-8,y1:-4,x2:8,y2:-4,class:'bridge-rail'}),E('line',{x1:-8,y1:4,x2:8,y2:4,class:'bridge-rail'}),E('line',{x1:-9,y1:-6,x2:-9,y2:6,class:'bridge-cap'}),E('line',{x1:9,y1:-6,x2:9,y2:6,class:'bridge-cap'}));}else if(kind==='ford'){g.append(E('path',{d:'M 0 -11 C 4 -8 -4 -5 0 -2 C 4 1 -4 4 0 7 C 3 9 -2 11 0 13',class:'ford-water'}));[-5,0,5].forEach((cx,i)=>g.append(E('circle',{cx,cy:i===1?0:(i===0?-1:1),r:2.2,class:'ford-stone'})));}else{g.append(E('polygon',{points:'0,-7 6,0 0,7 -6,0',class:'roadstone'}),E('line',{x1:-8,y1:0,x2:8,y2:0,stroke:'#d0b98c','stroke-width':'1.2'}));}
const hit=E('circle',{cx:0,cy:0,r:12,fill:'transparent'});hit.onclick=()=>showFeature(x);g.append(hit);roadSymbols.append(g)}
function drawRoute(st,x,i){const fs=[x.from,...(x.via||[]),x.to].map(k=>F(st,k)).filter(Boolean),ps=fs.map((q,j)=>anchor(q,x,fs[j?j-1:1]));if(ps.length<2)return;const d=curve(ps,i%2?-1:1),g=E('g');if(x.render==='winding_rough_track')g.append(E('path',{d,class:'track'}));else g.append(E('path',{d,class:'roadE'}),E('path',{d,class:'road'}));const h=E('path',{d,class:'hit'});h.onclick=()=>showRoad(x);g.append(h);roads.append(g);for(let j=0;j<fs.length;j++){const fx=fs[j];if(!inlineKind(fx))continue;const prev=ps[Math.max(0,j-1)],next=ps[Math.min(ps.length-1,j+1)];drawInlineSymbol(fx,prev,next)}}
function box(g,x,y,w,h,c='building'){g.append(E('rect',{x:x-w/2,y:y-h/2,width:w,height:h,rx:1,class:c}))}
function field(g,x,y,w,h){g.append(E('rect',{x:x-w/2,y:y-h/2,width:w,height:h,rx:2,class:'field'}))}
function drawSettlements(st){const k=F(st,'kareth');if(k){const p=P(k.position),g=E('g');g.append(E('path',{d:`M ${p.x-18} ${p.y-12} L ${p.x+11} ${p.y-14} L ${p.x+18} ${p.y-2} L ${p.x+14} ${p.y+13} L ${p.x-12} ${p.y+14} L ${p.x-19} ${p.y+4} Z`,class:'wall'}),E('path',{d:`M ${p.x-11} ${p.y-7} L ${p.x+7} ${p.y-8} L ${p.x+10} ${p.y-1} L ${p.x+7} ${p.y+8} L ${p.x-7} ${p.y+8} L ${p.x-12} ${p.y+2} Z`,class:'oldwall'}));box(g,p.x-4,p.y-1,6,4);box(g,p.x+5,p.y+1,6,4);field(g,p.x-4,p.y+6,7,3);field(g,p.x+5,p.y+7,6,3);settlements.append(g)}const a=F(st,'avelin');if(a){const p=P(a.position),g=E('g');g.append(E('path',{d:`M ${p.x-10} ${p.y-8} L ${p.x+8} ${p.y-9} L ${p.x+11} ${p.y} L ${p.x+7} ${p.y+9} L ${p.x-8} ${p.y+8} L ${p.x-11} ${p.y} Z`,class:'wall'}));box(g,p.x-2,p.y-1,4.5,3);box(g,p.x+4,p.y+2,5,3);field(g,p.x+21,p.y+2,9,5);field(g,p.x+19,p.y+10,8,4);settlements.append(g)}for(const id of ['valek','daren-ford']){const q=F(st,id);if(!q)continue;const p=P(q.position),g=E('g');for(let i=0;i<(id==='daren-ford'?11:8);i++){const ang=i*2.4,rr=6+(i%4)*4;box(g,p.x+Math.cos(ang)*rr,p.y+Math.sin(ang)*rr*.7,4+(i%3),2.8+(i%2))}if(id==='daren-ford'){g.append(E('path',{d:`M ${p.x-52} ${p.y+25} C ${p.x-18} ${p.y+19}, ${p.x+18} ${p.y+20}, ${p.x+54} ${p.y+28}`,class:'water'}));field(g,p.x-38,p.y-2,14,7);field(g,p.x-35,p.y+9,13,6)}settlements.append(g)}}
function drawTerrain(st){const k=F(st,'kareth'),a=F(st,'avelin'),sd=F(st,'saddle-ridge'),cr=F(st,'stone-bottomed-stream-crossing'),dr=F(st,'daren-ford'),qy=F(st,'kareth-quarry');if(k&&a&&sd){const K=P(k.position),A=P(a.position),S=P(sd.position);terrain.append(E('path',{d:`M ${K.x+4} ${K.y+28} Q ${A.x+28} ${A.y+50} ${S.x+90} ${S.y+34} L ${S.x+82} ${S.y-34} Q ${A.x+12} ${A.y-34} ${K.x-22} ${K.y-7} Z`,fill:'rgba(164,138,100,.11)'}));for(let n=-1;n<=2;n++)terrain.append(E('path',{d:`M ${S.x-76} ${S.y+n*11} Q ${S.x-16} ${S.y-22+n*6} ${S.x+42} ${S.y-7+n*6} Q ${S.x+78} ${S.y+2+n*6} ${S.x+110} ${S.y-10+n*3}`,class:'ridge'}))}if(cr){const C=P(cr.position);terrain.append(E('path',{d:`M ${C.x-32} ${C.y-16} C ${C.x-10} ${C.y-7}, ${C.x-11} ${C.y+8}, ${C.x+2} ${C.y+11} C ${C.x+14} ${C.y+15}, ${C.x+18} ${C.y+2}, ${C.x+34} ${C.y+6}`,class:'water'}))}if(dr){const D=P(dr.position);terrain.append(E('path',{d:`M ${D.x-120} ${D.y+24} C ${D.x-56} ${D.y+16}, ${D.x+8} ${D.y+16}, ${D.x+114} ${D.y+31}`,class:'water'}))}if(qy){const Q=P(qy.position);terrain.append(E('path',{d:`M ${Q.x-72} ${Q.y+44} Q ${Q.x-38} ${Q.y+2} ${Q.x+18} ${Q.y-18} Q ${Q.x+58} ${Q.y-28} ${Q.x+72} ${Q.y-3} Q ${Q.x+35} ${Q.y+36} ${Q.x-11} ${Q.y+49} Z`,fill:'rgba(122,115,104,.15)'}))}}
function drawMarker(x,st){if(!x.position||x.render===false||eventTypes.has(x.type)||inlineKind(x))return;if(!['fortified_settlement','town','quarry_work_site','ridge_landmark','route_landmark','former_quarry'].includes(x.type))return;const p=P(x.position),g=E('g',{class:'marker',transform:`translate(${p.x} ${p.y})`}),t=E('text',{x:0,y:2});t.textContent=x.type==='fortified_settlement'?'▣':x.type==='town'?'◆':x.type.includes('quarry')?'⚒':'⌁';g.append(t);if(st.current_position?.feature===x.id)g.append(E('circle',{cx:0,cy:0,r:18,class:'current'}));g.onclick=()=>cards[x.id]?showSettlement(x):showFeature(x);markers.append(g);const tx=E('text',{x:p.x+14,y:p.y-10,class:`label ${cards[x.id]?'major':''}`});tx.textContent=x.name;labels.append(tx)}
function apply(){view.w=Math.min(BASE.w,Math.max(360,view.w));view.h=view.w*(BASE.h/BASE.w);view.x=Math.max(BASE.x,Math.min(BASE.x+BASE.w-view.w,view.x));view.y=Math.max(BASE.y,Math.min(BASE.y+BASE.h-view.h,view.y));svg.setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);zoomRead.textContent=(BASE.w/view.w).toFixed(1)+'×'}
function zoom(m){const cx=view.x+view.w/2,cy=view.y+view.h/2,nw=view.w/m;view={x:cx-nw/2,y:cy-(nw*(BASE.h/BASE.w))/2,w:nw,h:nw*(BASE.h/BASE.w)};apply()}
zoomIn.onclick=()=>zoom(1.35);zoomOut.onclick=()=>zoom(1/1.35);reset.onclick=()=>{view={...BASE};apply()};svg.addEventListener('pointerdown',e=>{if(e.target.closest&&e.target.closest('.marker,.inline-symbol'))return;drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};svg.setPointerCapture(e.pointerId)});svg.addEventListener('pointermove',e=>{if(!drag)return;const r=svg.getBoundingClientRect(),dx=(e.clientX-drag.x)*view.w/r.width,dy=(e.clientY-drag.y)*view.h/r.height;view.x=drag.vx-dx;view.y=drag.vy-dy;apply()});svg.addEventListener('pointerup',()=>drag=null);svg.addEventListener('pointercancel',()=>drag=null);
fetch('map-state.json').then(r=>r.json()).then(st=>{drawTerrain(st);st.placed_routes.forEach((x,i)=>drawRoute(st,x,i));drawSettlements(st);st.features.forEach(x=>drawMarker(x,st));roadSummary.innerHTML=[['Kareth → Valek',roadNotes['kareth-valek-road'][0]],['Valek west road',roadNotes['valek-west-road-observed'][1]],['Quarry road',roadNotes['kareth-quarry-route'][0]]].map(([a,b])=>`<div class='route'><strong>${a}</strong><div class='muted'>${b}</div></div>`).join('');apply()}).catch(()=>{detailTitle.textContent='Load issue';detailBody.innerHTML='<p>Map data could not be loaded.</p>'});
</script></body></html>
